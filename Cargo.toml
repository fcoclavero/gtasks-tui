[package]
name = "gws-tasks-tui"
version = "0.1.4"
edition = "2024"
rust-version = "1.98.1"
description = "Terminal UI for Google Tasks, backed by the gws CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/fcoclavero/gtasks-tui"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
open = "5"
ratatui = "0.30"
ratatui-textarea = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
textwrap = { version = "0.16", default-features = false, features = ["std", "unicode-width"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
unicode-width = "0.2"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
